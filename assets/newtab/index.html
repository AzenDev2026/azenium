<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
:root {
    --bg: #202020;
    --fg: #e6e6e6;
    --dim: #9a9a9a;
    --accent: #5170ff;
    --card: #262626;
    --border: #383838;
    --input: #282828;
}
body.light {
    --bg: #f4f5f8;
    --fg: #1c1e22;
    --dim: #6a7078;
    --card: #ffffff;
    --border: #d9dde3;
    --input: #ffffff;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    height: 100vh;
    font-family: system-ui, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    transition: background 0.25s;
}

/* ---------- Center: brand row + search box (slightly above middle) ---------- */
.center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: translateY(-56px);
    user-select: none;
}
.brandrow {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 30px;
}
.logo {
    width: 64px;
    height: 64px;
    border-radius: 15px;
    -webkit-user-drag: none;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.25));
}
.brand {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 0.5px;
}
.brand .accent { color: var(--accent); }

.searchbox {
    width: min(580px, 78vw);
    height: 52px;
    display: flex;
    align-items: center;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 0 20px;
    gap: 12px;
    transition: border-color 0.18s, box-shadow 0.18s;
}
.searchbox:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
}
.searchbox svg { flex: none; opacity: 0.55; }
.searchbox input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--fg);
    font-size: 16px;
}
.searchbox input::placeholder { color: var(--dim); }

/* ---------- Bottom-left: weather ---------- */
.weather {
    position: fixed;
    left: 26px;
    bottom: 26px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 18px;
    user-select: none;
    transition: background 0.25s, border-color 0.25s;
}
.weather .emoji { font-size: 30px; line-height: 1; }
.weather .temp { font-size: 22px; font-weight: 600; }
.weather .meta { display: flex; flex-direction: column; font-size: 12px; color: var(--dim); }
.weather .city { font-size: 14px; color: var(--fg); margin-bottom: 1px; }
.weather.loading .emoji { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

/* ---------- Bottom-right: clock ---------- */
.clock {
    position: fixed;
    right: 26px;
    bottom: 26px;
    text-align: right;
    user-select: none;
}
.clock .time { font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; }
.clock .date { font-size: 13px; color: var(--dim); margin-top: 2px; }
</style>
</head>
<body>
<div class="center">
    <div class="brandrow">
        <img class="logo" src="../azenium.png" alt="Azenium">
        <div class="brand">Azen<span class="accent">ium</span></div>
    </div>
    <form class="searchbox" id="search" action="https://www.google.com/search" method="GET">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input type="text" name="q" id="q" placeholder="Search or enter a URL" autocomplete="off" autofocus>
    </form>
</div>

<div class="weather loading" id="weather">
    <div class="emoji" id="w-emoji">⛅</div>
    <div class="temp" id="w-temp">--°</div>
    <div class="meta">
        <span class="city" id="w-city">Sydney</span>
        <span id="w-desc">Loading weather…</span>
    </div>
</div>

<div class="clock">
    <div class="time" id="c-time">--:--</div>
    <div class="date" id="c-date"></div>
</div>

<script>
// ---------- Theme parameters (injected by the browser as URL fragment) ----------
(function () {
    // Parameters arrive as #theme=dark&accent=xxxxxx (fragment, safe for file:// URLs)
    const params = new URLSearchParams(location.hash.replace(/^#/, ""));
    if (params.get("theme") === "light") document.body.classList.add("light");
    const accent = params.get("accent");
    if (accent && /^[0-9a-fA-F]{6}$/.test(accent)) {
        document.documentElement.style.setProperty("--accent", "#" + accent);
    }
})();

// ---------- Search: handle navigation in JS (Chromium blocks native form
// submission from file:// pages with ERR_NETWORK_ACCESS_DENIED) ----------
document.getElementById("search").addEventListener("submit", function (e) {
    e.preventDefault(); // never use the native form submission
    const text = document.getElementById("q").value.trim();
    if (!text) return;
    if (text.includes(".") && !text.includes(" ")) {
        // Looks like a domain/URL
        location.href = /^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : "https://" + text;
    } else {
        // Plain text → Google search, same as the address bar
        location.href = "https://www.google.com/search?q=" + encodeURIComponent(text);
    }
});

// ---------- Clock ----------
function tick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("c-time").textContent = hh + ":" + mm;
    document.getElementById("c-date").textContent = now.toLocaleDateString(
        "en-AU", { year: "numeric", month: "long", day: "numeric", weekday: "long" }
    );
}
tick();
setInterval(tick, 1000 * 20);

// ---------- Weather (Open-Meteo, free, no API key) ----------
const WMO = {
    0: ["☀️", "Clear"], 1: ["🌤️", "Mostly clear"], 2: ["⛅", "Partly cloudy"],
    3: ["☁️", "Overcast"], 45: ["🌫️", "Foggy"], 48: ["🌫️", "Icy fog"],
    51: ["🌦️", "Light drizzle"], 53: ["🌦️", "Drizzle"], 55: ["🌧️", "Heavy drizzle"],
    61: ["🌧️", "Light rain"], 63: ["🌧️", "Rain"], 65: ["🌧️", "Heavy rain"],
    71: ["🌨️", "Light snow"], 73: ["🌨️", "Snow"], 75: ["❄️", "Heavy snow"],
    80: ["🌦️", "Light showers"], 81: ["🌧️", "Showers"], 82: ["⛈️", "Violent showers"],
    95: ["⛈️", "Thunderstorm"], 96: ["⛈️", "Storm with hail"], 99: ["⛈️", "Severe storm"],
};
const DEFAULT_CITY = { lat: -33.8688, lon: 151.2093, name: "Sydney" };

async function loadWeather() {
    const box = document.getElementById("weather");
    let place = DEFAULT_CITY;
    try {
        const pos = await new Promise((resolve, reject) =>
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000 })
        );
        place = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: "Current location" };
    } catch (_) { /* fall back to the default city when geolocation is denied */ }
    try {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=" + place.lat +
            "&longitude=" + place.lon + "&current=temperature_2m,weather_code";
        const resp = await fetch(url);
        const data = await resp.json();
        const cur = data.current;
        const [emoji, desc] = WMO[cur.weather_code] || ["🌡️", "Unknown"];
        document.getElementById("w-emoji").textContent = emoji;
        document.getElementById("w-temp").textContent = Math.round(cur.temperature_2m) + "°";
        document.getElementById("w-city").textContent = place.name;
        document.getElementById("w-desc").textContent = desc;
        box.classList.remove("loading");
    } catch (_) {
        document.getElementById("w-temp").textContent = "--°";
        document.getElementById("w-desc").textContent = "Weather unavailable";
        box.classList.remove("loading");
    }
}
loadWeather();
</script>
</body>
</html>
